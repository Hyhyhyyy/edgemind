# EdgeMind 配置（环境变量集中管理，避免硬编码）
apiVersion: v1
kind: ConfigMap
metadata:
  name: edgemind-cloud-cm
  namespace: edgemind
data:
  EDGEMIND_HTTP_PORT: "8000"
  EDGEMIND_WS_PORT: "9000"
  VLLM_BASE_URL: ""            # 生产填 http://edgemind-vllm:8000
  VLLM_MODEL: "qwen2.5-7b"
  DIAG_INTERVAL: "5"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edgemind-edge-cm
  namespace: edgemind
data:
  EDGE_REGION: "factory-a"
  EDGE_GPU: "nvidia-t4"
  EDGE_CLOUD_WS_URL: "ws://edgemind-cloud.edgemind.svc:9000"
  HB_INTERVAL: "3"
  HB_TIMEOUT: "9"
